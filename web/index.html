<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>A-OS</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #0d0d0d;
    --line: #1e1e1e;
    --fg: #b9c2bd;
    --dim: #5b6360;
    --green: #39ff14;
    --cyan: #00ffff;
    --red: #ff003c;
    --blue: #2f81f7;
    --amber: #ffb000;
    --mono: "Fira Code", "JetBrains Mono", Consolas, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.5 var(--mono);
    display: flex; flex-direction: column;
    height: 100dvh; overflow: hidden;
    text-rendering: optimizeSpeed;
  }

  header {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px;
    padding-top: calc(8px + env(safe-area-inset-top));
    border-bottom: 1px solid var(--line);
    background: #0e0e0e;
    font-size: 11px; letter-spacing: .04em;
  }
  header .brand { color: var(--green); font-weight: 700; letter-spacing: .12em; }
  header .sep { color: #2a2a2a; }
  header .stat { color: var(--dim); white-space: nowrap; }
  header .stat b { color: var(--fg); font-weight: 500; }
  header .dot {
    width: 6px; height: 6px; border-radius: 50%; margin-left: auto;
    background: var(--red); box-shadow: 0 0 8px var(--red);
  }
  header .dot.on { background: var(--green); box-shadow: 0 0 8px var(--green); }

  main {
    flex: 1 1 auto; min-height: 0;
    display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.35fr) minmax(0,.9fr);
    gap: 1px; background: var(--line);
  }
  .pane { background: var(--panel); min-height: 0; min-width: 0; display: flex; flex-direction: column; }
  .pane > .head {
    flex: 0 0 auto; padding: 6px 10px; font-size: 10px; letter-spacing: .14em;
    color: var(--dim); text-transform: uppercase; border-bottom: 1px solid var(--line);
  }
  .pane > .body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 8px 10px; }
  .body::-webkit-scrollbar { width: 6px; }
  .body::-webkit-scrollbar-thumb { background: #222; border-radius: 3px; }

  #graph { display: block; min-width: 100%; }
  #graph .edge { stroke: #23302c; stroke-width: 1; fill: none; }
  #graph .box { fill: #0b1210; stroke: #1f2a26; }
  #graph .box.active { stroke: var(--cyan); filter: drop-shadow(0 0 4px rgba(0,255,255,.45)); }
  #graph .box.success { stroke: var(--green); }
  #graph .box.doc { stroke: var(--amber); }
  #graph .box.failed, #graph .box.archived { stroke: #5a1620; }
  #graph text { font: 10px var(--mono); fill: #9aa5a1; }
  #graph text.id { fill: #445; }
  #graph .empty { fill: var(--dim); font-size: 11px; }

  .node {
    position: relative; padding: 3px 0 3px 12px; margin: 2px 0;
    font-size: 12px; color: var(--fg); border-left: 2px solid #1f1f1f;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .node .id { color: #3a3f3d; margin-right: 6px; }
  .node .kind { color: var(--dim); font-size: 10px; margin-right: 6px; }
  .node.active, .node.running { border-left-color: var(--cyan); box-shadow: -6px 0 12px -6px var(--cyan); }
  .node.success { border-left-color: var(--green); }
  .node.doc { border-left-color: var(--amber); }
  .node.failed, .node.archived { border-left-color: var(--red); color: #6b2229; text-decoration: line-through; }

  #terminal { color: var(--green); font-size: 12.5px; }
  #terminal .ln { padding: 1px 0; white-space: pre-wrap; word-break: break-word; }
  #terminal .ln.sys { color: var(--amber); }
  #terminal .ln.err { color: var(--red); }
  #terminal .ln.fault { color: var(--cyan); text-shadow: 0 0 8px rgba(0,255,255,.35); }
  #terminal .ln.fault::before { content: "⚡ "; color: var(--cyan); }
  @keyframes flyin { from { transform: translateX(26px); opacity: 0; } to { transform: none; opacity: 1; } }
  .pg.fresh { animation: flyin .35s ease-out; border-color: var(--cyan) !important;
              box-shadow: 0 0 14px -4px var(--cyan); }
  #terminal .ln::before { content: "› "; color: #23421f; }

  .pg {
    padding: 6px 8px; margin: 5px 0;
    border: 1px solid #1b2a33; border-radius: 3px; background: #08110f;
    font-size: 11.5px; color: #7f8c88;
    transition: border-color .2s, opacity .2s;
  }
  .pg.on { border-color: var(--blue); box-shadow: 0 0 10px -6px var(--blue); }
  .pg.seg-system { border-color: var(--amber); box-shadow: 0 0 12px -6px var(--amber); }
  .pg.seg-system .num { color: var(--amber); }
  .pg.seg-human { border-color: var(--cyan); box-shadow: 0 0 12px -6px var(--cyan); }
  .pg.seg-human .num { color: var(--cyan); }
  .pg.seg-dag { border-color: var(--green); }
  .pg.seg-dag .num { color: var(--green); }
  .pg .seg { font-size: 9px; letter-spacing: .08em; color: var(--dim);
             border: 1px solid #223; border-radius: 2px; padding: 0 4px; }
  .pg.stale { opacity: .45; text-decoration: line-through; border-color: #331015; }
  .pg .top { display: flex; gap: 6px; align-items: center; margin-bottom: 3px; }
  .pg .num { color: var(--blue); }
  .pg .src { color: var(--dim); font-size: 10px; }
  .pg .pin { color: var(--amber); font-size: 10px; margin-left: auto; }
  .pg .txt { color: #9aa5a1; word-break: break-word; }

  footer {
    flex: 0 0 auto; position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: #0b0b0b; border-top: 1px solid var(--line);
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    display: flex; gap: 8px;
  }
  footer input {
    flex: 1 1 auto; min-width: 0;
    background: #050505; border: 1px solid #262626; border-radius: 3px;
    color: var(--green); font: inherit; padding: 10px 12px;
    outline: none; caret-color: var(--green);
  }
  footer input:focus { border-color: var(--green); box-shadow: 0 0 12px -6px var(--green); }
  footer button {
    flex: 0 0 auto; padding: 0 16px;
    background: #0f1a0f; color: var(--green);
    border: 1px solid #24501f; border-radius: 3px; font: inherit; cursor: pointer;
  }
  footer button:active { background: #16301a; }
  footer button.ghost { color: var(--red); border-color: #4a1018; background: #170a0c; }

  nav.tabs {
    display: none; position: fixed; left: 0; right: 0;
    bottom: calc(58px + env(safe-area-inset-bottom)); z-index: 49;
    background: #0b0b0b; border-top: 1px solid var(--line);
    grid-template-columns: repeat(3, 1fr);
  }
  nav.tabs button {
    padding: 9px 0; background: none; border: 0; border-top: 2px solid transparent;
    color: var(--dim); font: inherit; font-size: 11px; letter-spacing: .1em; cursor: pointer;
  }
  nav.tabs button.on { color: var(--green); border-top-color: var(--green); }

  @media (max-width: 820px) {
    main { display: block; padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
    .pane { display: none; height: 100%; }
    .pane.on { display: flex; }
    nav.tabs { display: grid; }
    header .stat.hide-sm { display: none; }
    #terminal { font-size: 13px; }
  }
  @media (min-width: 821px) {
    main { padding-bottom: 58px; }
  }
</style>
</head>
<body>

<header>
  <span class="brand">A-OS</span>
  <span class="sep">|</span>
  <span class="stat">nodes <b id="s-nodes">0</b></span>
  <span class="stat hide-sm">pages <b id="s-pages">0</b></span>
  <span class="stat">tokens <b id="s-tokens">0</b></span>
  <span class="stat hide-sm">workers <b id="s-workers">0</b></span>
  <span class="stat hide-sm">run <b id="s-run">0</b></span>
  <span class="dot" id="dot"></span>
</header>

<main>
  <section class="pane" data-pane="dag">
    <div class="head">状态树</div>
    <div class="body" id="dag"><svg id="graph"></svg></div>
  </section>
  <section class="pane on" data-pane="term">
    <div class="head">终端</div>
    <div class="body" id="terminal"></div>
  </section>
  <section class="pane" data-pane="pages">
    <div class="head">页表</div>
    <div class="body" id="pages"></div>
  </section>
</main>

<nav class="tabs">
  <button data-tab="term" class="on">终端</button>
  <button data-tab="dag">状态树</button>
  <button data-tab="pages">页表</button>
</nav>

<footer>
  <input id="cmd" placeholder="输入指令…" autocomplete="off" autocapitalize="off"
         enterkeyhint="send" spellcheck="false">
  <button id="send">发送</button>
  <button id="kill" class="ghost" title="中断">⏻</button>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const el = { dag: $('dag'), term: $('terminal'), pages: $('pages') };
const stat = { nodes: $('s-nodes'), pages: $('s-pages'), tokens: $('s-tokens'), run: $('s-run'), workers: $('s-workers') };
let ws = null, retry = 0, lastLogLen = -1, pinnedBottom = true, seenPages = new Set();

function wsBase() {
  const p = location.pathname.replace(/\/[^/]*$/, '').replace(/\/$/, '');
  return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + p;
}

function connect() {
  try { ws = new WebSocket(wsBase() + '/ws'); } catch (e) { return; }
  ws.onopen = () => { $('dot').classList.add('on'); retry = 0; };
  ws.onclose = () => {
    $('dot').classList.remove('on');
    retry = Math.min(retry + 1, 6);
    setTimeout(connect, 500 * retry);
  };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
  ws.onmessage = (ev) => {
    try { render(JSON.parse(ev.data)); } catch (e) {}
  };
}

const SVGNS = 'http://www.w3.org/2000/svg';
const NW = 150, NH = 22, GX = 14, GY = 34;

function drawGraph(nodes) {
  const svg = $('graph');
  if (!svg) return;
  svg.innerHTML = '';
  if (!nodes.length) {
    const t = document.createElementNS(SVGNS, 'text');
    t.setAttribute('class', 'empty'); t.setAttribute('x', 8); t.setAttribute('y', 18);
    t.textContent = '（还没有节点）';
    svg.appendChild(t);
    return;
  }

  const byId = new Map(nodes.map(n => [n.id, n]));
  const depthOf = (n) => {
    let d = 0, cur = n, guard = 0;
    while (cur && cur.pid != null && byId.has(cur.pid) && guard++ < 50) {
      cur = byId.get(cur.pid); d++;
    }
    return d;
  };
  const cols = new Map();
  nodes.forEach(n => {
    const d = depthOf(n);
    if (!cols.has(d)) cols.set(d, []);
    cols.get(d).push(n);
  });

  const pos = new Map();
  let maxX = 0, maxY = 0;
  [...cols.keys()].sort((a, b) => a - b).forEach(d => {
    cols.get(d).forEach((n, i) => {
      const x = 12 + i * (NW + GX), y = 12 + d * GY;
      pos.set(n.id, { x, y });
      maxX = Math.max(maxX, x + NW);
      maxY = Math.max(maxY, y + NH);
    });
  });

  // 连线
  nodes.forEach(n => {
    const a = pos.get(n.id), b = n.pid != null ? pos.get(n.pid) : null;
    if (!a || !b) return;
    const path = document.createElementNS(SVGNS, 'path');
    const x1 = b.x + NW / 2, y1 = b.y + NH, x2 = a.x + NW / 2, y2 = a.y;
    const my = (y1 + y2) / 2;
    path.setAttribute('d', `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`);
    path.setAttribute('class', 'edge');
    svg.appendChild(path);
  });

  // 节点
  nodes.forEach(n => {
    const p = pos.get(n.id);
    const g = document.createElementNS(SVGNS, 'g');
    const rect = document.createElementNS(SVGNS, 'rect');
    rect.setAttribute('x', p.x); rect.setAttribute('y', p.y);
    rect.setAttribute('width', NW); rect.setAttribute('height', NH);
    rect.setAttribute('rx', 3);
    rect.setAttribute('class', 'box ' + n.status + ' ' + n.kind);
    const label = document.createElementNS(SVGNS, 'text');
    label.setAttribute('x', p.x + 6); label.setAttribute('y', p.y + 15);
    const short = (n.text || '').slice(0, 16);
    label.textContent = `#${n.id} ${short}`;
    const idt = document.createElementNS(SVGNS, 'text');
    idt.setAttribute('class', 'id');
    g.appendChild(rect); g.appendChild(label);
    svg.appendChild(g);
  });

  svg.setAttribute('width', maxX + 12);
  svg.setAttribute('height', maxY + 12);
}

function esc(s) {
  return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

function render(s) {
  stat.nodes.textContent = (s.dag || []).length;
  stat.pages.textContent = (s.pages || []).length;
  stat.tokens.textContent = s.tokens || 0;
  stat.run.textContent = s.running || 0;
  if (stat.workers) stat.workers.textContent = s.workers || 0;

  drawGraph(s.dag || []);

  el.pages.innerHTML = (s.pages || []).map(p =>
    `<div class="pg seg-${esc(p.segment || 'data')} ${(p.stale || p.state === 'swapped_out') ? 'stale' : 'on'}">` +
    `<div class="top"><span class="num">#${p.id}</span>` +
    `<span class="seg">${esc((p.segment || 'data').toUpperCase())}</span>` +
    `${p.source ? `<span class="src">${esc(p.source)}</span>` : ''}` +
    `${p.pinned ? '<span class="pin">PIN</span>' : ''}</div>` +
    `<div class="txt">${esc(p.preview)}</div></div>`).join('');

  document.querySelectorAll('#pages .pg').forEach((node, i) => {
    const p = (s.pages || [])[i];
    if (p && !seenPages.has(p.id)) {
      node.classList.add('fresh');
      setTimeout(() => node.classList.remove('fresh'), 900);
    }
  });
  (s.pages || []).forEach(p => seenPages.add(p.id));

  const logs = s.log || [];
  if (logs.length !== lastLogLen) {
    lastLogLen = logs.length;
    el.term.innerHTML = logs.map(l =>
      `<div class="ln ${esc(l.cls || '')}">${esc(l.text)}</div>`).join('');
    if (pinnedBottom) el.term.scrollTop = el.term.scrollHeight;
  }
}

el.term.addEventListener('scroll', () => {
  pinnedBottom = el.term.scrollHeight - el.term.scrollTop - el.term.clientHeight < 40;
});

function send() {
  const text = $('cmd').value.trim();
  if (!text || !ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ cmd: 'inject', text }));
  $('cmd').value = '';
  pinnedBottom = true;
}

$('send').onclick = send;
$('kill').onclick = () => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ cmd: 'kill' })); };
$('cmd').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

document.querySelectorAll('nav.tabs button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    const target = btn.dataset.tab;
    document.querySelectorAll('.pane').forEach(p => {
      p.classList.toggle('on', p.dataset.pane === target);
    });
    if (target === 'term') { el.term.scrollTop = el.term.scrollHeight; pinnedBottom = true; }
  };
});

if (window.visualViewport) {
  const vv = window.visualViewport;
  vv.addEventListener('resize', () => { document.body.style.height = vv.height + 'px'; });
}

// 支持 ?tab=dag|pages|term 深链
(function initTab() {
  const want = new URLSearchParams(location.search).get('tab');
  if (!want) return;
  const btn = document.querySelector(`nav.tabs button[data-tab="${want}"]`);
  if (btn) btn.click();
})();

connect();
</script>
</body>
</html>
