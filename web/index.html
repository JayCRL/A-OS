<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>A-OS</title>
<style>
  :root {
    --bg: #0f1115;
    --bg-soft: #151923;
    --line: #232936;
    --fg: #e6e9ef;
    --dim: #8b93a7;
    --accent: #8b9cff;
    --accent-soft: #1b2140;
    --user: #2a3350;
    --radius: 18px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
            "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.65 var(--font);
    display: flex; flex-direction: column;
    height: 100dvh; overflow: hidden;
  }

  header {
    flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
    padding: 14px 18px calc(12px);
    padding-top: calc(14px + env(safe-area-inset-top));
    border-bottom: 1px solid rgba(255,255,255,.04);
    background: rgba(15,17,21,.82);
    backdrop-filter: blur(12px);
  }
  header .name { font-weight: 600; letter-spacing: .02em; font-size: 16px; }
  header .status { display: flex; align-items: center; gap: 5px; color: var(--dim); font-size: 12px; }
  header .dot {
    width: 6px; height: 6px; border-radius: 50%; background: #5b6478;
    transition: background .3s, box-shadow .3s;
  }
  header .dot.on { background: #5ad18a; box-shadow: 0 0 10px rgba(90,209,138,.55); }
  header .more {
    margin-left: auto; width: 34px; height: 34px; border-radius: 50%;
    border: 0; background: transparent; color: var(--dim); font-size: 20px;
    line-height: 1; cursor: pointer;
  }
  header .more:hover { background: rgba(255,255,255,.05); color: var(--fg); }

  main {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    padding: 22px 16px 28px;
    scroll-behavior: smooth;
  }
  .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  .msg { display: flex; gap: 10px; align-items: flex-end; }
  .msg .avatar {
    flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #cfd6ea;
    background: linear-gradient(135deg, #26304d, #1a2032);
    border: 1px solid rgba(139,156,255,.18);
  }
  .msg .bubble {
    max-width: min(78%, 600px);
    padding: 11px 15px;
    border-radius: var(--radius);
    background: var(--bg-soft);
    border: 1px solid var(--line);
    white-space: pre-wrap; word-break: break-word;
    font-size: 15px;
  }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .bubble {
    background: var(--user); border-color: transparent;
    border-bottom-right-radius: 6px;
  }
  .msg.bot .bubble { border-bottom-left-radius: 6px; }
  .msg .time { display: none; }

  .typing { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 13px; padding-left: 38px; }
  .typing .dots { display: inline-flex; gap: 3px; }
  .typing i {
    width: 5px; height: 5px; border-radius: 50%; background: var(--dim);
    animation: blink 1.1s infinite ease-in-out;
  }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-2px); } }

  .welcome { color: var(--dim); text-align: center; font-size: 13px; margin-top: 12vh; line-height: 2; }
  .welcome b { color: var(--fg); font-weight: 500; }

  footer {
    flex: 0 0 auto;
    padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 72%, transparent);
  }
  .composer {
    max-width: 760px; margin: 0 auto;
    display: flex; align-items: flex-end; gap: 8px;
    background: var(--bg-soft); border: 1px solid var(--line);
    border-radius: 22px; padding: 8px 8px 8px 16px;
    transition: border-color .2s;
  }
  .composer:focus-within { border-color: #3a4566; }
  .composer textarea {
    flex: 1 1 auto; min-width: 0; max-height: 160px;
    resize: none; border: 0; outline: 0; background: transparent;
    color: var(--fg); font: inherit; line-height: 1.5; padding: 5px 0;
  }
  .composer textarea::placeholder { color: #5d6579; }
  .composer button {
    flex: 0 0 auto; width: 36px; height: 36px; border-radius: 50%;
    border: 0; background: var(--accent); color: #0d1020;
    font-size: 17px; cursor: pointer; display: flex;
    align-items: center; justify-content: center;
    transition: opacity .2s, transform .1s;
  }
  .composer button:disabled { opacity: .3; cursor: default; }
  .composer button:active:not(:disabled) { transform: scale(.94); }

  /* 调试抽屉：默认不出现 */
  .sheet {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(0,0,0,.5); backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .sheet.on { opacity: 1; pointer-events: auto; }
  .sheet .panel {
    position: absolute; right: 0; top: 0; bottom: 0; width: min(420px, 92vw);
    background: #11141b; border-left: 1px solid var(--line);
    padding: 18px; overflow-y: auto;
    transform: translateX(20px); transition: transform .22s;
  }
  .sheet.on .panel { transform: none; }
  .sheet h3 { margin: 0 0 14px; font-size: 14px; color: var(--fg); font-weight: 600; }
  .sheet .row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,.04); font-size: 13px; }
  .sheet .row span:first-child { color: var(--dim); }
  .sheet pre {
    white-space: pre-wrap; word-break: break-word; font-size: 12px;
    color: #9aa3b8; background: #0c0e13; border: 1px solid var(--line);
    border-radius: 10px; padding: 10px; margin: 8px 0 18px;
  }
  .sheet .close { margin-top: 6px; width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--dim); font: inherit; cursor: pointer; }

  @media (max-width: 600px) {
    main { padding: 16px 12px 20px; }
    .msg .bubble { max-width: 84%; }
    header { padding-left: 14px; padding-right: 12px; }
  }
</style>
</head>
<body>

<header>
  <span class="name">A-OS</span>
  <span class="status"><i class="dot" id="dot"></i><span id="status-text">连接中</span></span>
  <button class="more" id="more" title="状态">⋯</button>
</header>

<main id="main">
  <div class="wrap" id="wrap"></div>
</main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="说点什么…" enterkeyhint="send"></textarea>
    <button id="send" title="发送">↑</button>
  </div>
</footer>

<div class="sheet" id="sheet">
  <div class="panel">
    <h3>运行状态</h3>
    <div id="debug-body"><div class="row"><span>读取中</span><span>…</span></div></div>
    <button class="close" id="close-sheet">收起</button>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const wrap = $('wrap'), input = $('input'), sendBtn = $('send');
let ws = null, retry = 0, busy = false, typingEl = null;

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function fmt(s) {
  // 轻量格式：行内代码、粗体；其余按纯文本
  return esc(s)
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
}
function timeText(ts) {
  const d = new Date((ts || Date.now()/1000) * 1000);
  return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
}

function atBottom() {
  return $('main').scrollHeight - $('main').scrollTop - $('main').clientHeight < 80;
}
function scrollDown() {
  requestAnimationFrame(() => { const m = $('main'); m.scrollTop = m.scrollHeight; });
}

function addMsg(role, text, ts) {
  const el = document.createElement('div');
  el.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  el.innerHTML =
    `<div class="avatar">${role === 'user' ? '你' : 'A'}</div>` +
    `<div class="bubble">${fmt(text)}<div class="time">${timeText(ts)}</div></div>`;
  wrap.appendChild(el);
  if (atBottom()) scrollDown();
  return el;
}

function showTyping(on) {
  if (on && !typingEl) {
    typingEl = document.createElement('div');
    typingEl.className = 'typing';
    typingEl.innerHTML = '<span class="dots"><i></i><i></i><i></i></span><span>正在想…</span>';
    wrap.appendChild(typingEl);
    scrollDown();
  } else if (!on && typingEl) {
    typingEl.remove(); typingEl = null;
  }
}

async function loadHistory() {
  try {
    const r = await fetch('/api/history');
    const data = await r.json();
    if (!data.turns || !data.turns.length) {
      const w = document.createElement('div');
      w.className = 'welcome';
      w.innerHTML = '在。<br><b>想聊什么，或者让我记点什么？</b>';
      wrap.appendChild(w);
      return;
    }
    data.turns.forEach(t => addMsg(t.role, t.text, t.ts));
    scrollDown();
  } catch (e) {}
}

function setBusy(on) {
  busy = on; sendBtn.disabled = on;
  $('status-text').textContent = on ? '在想' : (ws && ws.readyState === 1 ? '在线' : '离线');
}

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  try { ws = new WebSocket(proto + location.host + location.pathname.replace(/\/*$/, '') + '/ws'); }
  catch (e) { return; }
  ws.onopen = () => { retry = 0; $('dot').classList.add('on'); $('status-text').textContent = '在线'; };
  ws.onclose = () => {
    $('dot').classList.remove('on'); $('status-text').textContent = '离线';
    retry = Math.min(retry + 1, 5);
    setTimeout(connectWS, 400 * retry);
  };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
  ws.onmessage = (ev) => {
    let data; try { data = JSON.parse(ev.data); } catch (e) { return; }
    if (data.type === 'typing') { showTyping(data.on); setBusy(data.on); }
    if (data.type === 'reply') { showTyping(false); setBusy(false); addMsg('assistant', data.text); }
  };
}

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = ''; autoGrow();
  const w = wrap.querySelector('.welcome'); if (w) w.remove();
  addMsg('user', text);
  setBusy(true);
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ text }));
    return;
  }
  showTyping(true);
  try {
    const r = await fetch('/api/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ text })
    });
    const data = await r.json();
    showTyping(false);
    addMsg('assistant', data.reply || data.error || '刚才走神了。');
  } catch (e) {
    showTyping(false);
    addMsg('assistant', '连不上了，检查一下服务还在不在。');
  } finally {
    setBusy(false);
  }
}

function autoGrow() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
}

input.addEventListener('input', autoGrow);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
sendBtn.onclick = send;

let debugTimer = null;

async function refreshDebug() {
  const body = $('debug-body');
  try {
    const r = await fetch('/api/debug');
    const d = await r.json();
    const mk = (k, v) => `<div class="row"><span>${esc(k)}</span><span>${esc(v)}</span></div>`;
    const mem = d.memories || {}, k = d.kernel || {}, p = d.pages || k.pages || {};
    const n = k.nodes || {}, ds = d.dispatcher || {};
    const kinds = Object.entries(mem.by_kind || {}).map(([kk, v]) => `${kk} ${v}`).join(' · ') || '空';
    const pstats = d.process_stats || {};
    const procs = (d.processes || []).slice(0, 20)
      .map(x => `#${x.pid} ${x.state.padEnd(7)} ${x.name} ${x.elapsed}s`).join('\n') || '（无）';
    const sessions = (ds.list || []).slice(0, 12)
      .map(x => `#${x.pid} ${x.channel} ${x.turns}轮 ${x.title || ''}`).join('\n') || '（无）';
    const pages = (d.page_list || []).slice(0, 8)
      .map(x => `#${x.id} ${x.segment} ${x.state} ${x.source || ''} ${x.preview}`).join('\n') || '（空）';
    const tools = (d.tools || []).slice(-5).map(t => `${t.tool} ${t.ok ? '✓' : '✗'} ${t.elapsed}s`).join('\n') || '（还没用过）';
    const seg = p.segments || {};
    body.innerHTML =
      mk('进程', `${pstats.total || 0} 个 · 运行 ${pstats.running || 0} · 等待 ${pstats.waiting || 0}`) +
      '<pre>' + esc(procs) + '</pre>' +
      mk('会话', `${ds.sessions || 0} 个 · 复用 ${ds.reused || 0} · 新建 ${ds.created || 0}`) +
      '<pre>' + esc(sessions) + '</pre>' +
      mk('记忆', (mem.total || 0) + ' 条') + mk('分布', kinds) +
      mk('页表', `活跃 ${p.active || 0} / 换出 ${p.swapped || 0} · ${p.active_tokens || 0} tok`) +
      mk('分段', `SYS ${seg.system || 0} · HUMAN ${seg.human || 0} · DAG ${seg.dag || 0} · DATA ${seg.data || 0}`) +
      mk('图', `${(d.pager || {}).active || 0} 节点 · ${(d.pager || {}).edges || 0} 边 · ${(d.pager || {}).trials || 0} 试错`) +
      mk('状态树', `${n.total || 0} 节点 · 成功 ${n.success || 0}`) +
      mk('缺页', k.faults || 0) + mk('最近', (d.last || {}).answer || '—') +
      '<pre>' + esc(k.path || '（暂无路径）') + '</pre>' +
      '<pre>' + esc(pages) + '</pre>' +
      '<pre>' + esc(tools) + '</pre>';
  } catch (e) {
    body.innerHTML = '<div class="row"><span>读取失败</span><span>—</span></div>';
  }
}

function openDebug() {
  $('sheet').classList.add('on');
  refreshDebug();
  if (debugTimer) clearInterval(debugTimer);
  debugTimer = setInterval(refreshDebug, 2000);
}
function closeDebug() {
  $('sheet').classList.remove('on');
  if (debugTimer) { clearInterval(debugTimer); debugTimer = null; }
}

$('more').onclick = openDebug;
$('close-sheet').onclick = closeDebug;
$('sheet').onclick = (e) => { if (e.target === $('sheet')) closeDebug(); };

// 视觉键盘适配
if (window.visualViewport) {
  const vv = window.visualViewport;
  vv.addEventListener('resize', () => { document.body.style.height = vv.height + 'px'; });
}

connectWS();
loadHistory();
setTimeout(() => input.focus(), 300);
// 深链：?debug=1 直接展开运行状态（给维护者用）
if (new URLSearchParams(location.search).get('debug')) {
  setTimeout(() => $('more').click(), 500);
}
</script>
</body>
</html>
