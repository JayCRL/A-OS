<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A-OS 控制台</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#c9d1d9; --dim:#8b949e;
          --blue:#58a6ff; --green:#3fb950; --red:#f85149; --amber:#d29922; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column;
         background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system,"PingFang SC",monospace; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:center; }
  header b { color:var(--blue); }
  .stat { color:var(--dim); font-size:12px; }
  main { flex:1; display:grid; grid-template-columns: 1.1fr 1.4fr 1fr; gap:1px; background:var(--line); min-height:0; }
  section { background:var(--panel); padding:12px; overflow:auto; }
  h3 { margin:0 0 10px; font-size:12px; color:var(--dim); letter-spacing:.08em; text-transform:uppercase; }
  .node { padding:4px 8px; margin:2px 0; border-left:2px solid var(--blue); font-size:13px; }
  .node.archived { border-color:var(--dim); color:var(--dim); }
  .node.success { border-color:var(--green); }
  .node.failed { border-color:var(--red); }
  .node.doc { border-color:var(--amber); }
  .page { font-size:12px; padding:4px 0; border-bottom:1px dashed #21262d; color:var(--dim); }
  .page b { color:var(--fg); }
  .tag { font-size:11px; padding:0 5px; border-radius:3px; background:#21262d; margin-left:6px; }
  .tag.file { color:var(--blue); } .tag.stale { color:var(--red); } .tag.pinned { color:var(--amber); }
  #log div { font-size:12.5px; padding:1px 0; white-space:pre-wrap; word-break:break-all; }
  #log div.sys { color:var(--amber); }
  #log div.err { color:var(--red); }
  form { display:flex; gap:8px; margin-top:10px; }
  input { flex:1; background:#0d1117; border:1px solid var(--line); color:var(--fg);
          padding:8px; border-radius:4px; font:inherit; }
  button { background:#21262d; color:var(--fg); border:1px solid var(--line);
           padding:8px 14px; border-radius:4px; cursor:pointer; }
  button:hover { border-color:var(--blue); color:var(--blue); }
  .bar { position:sticky; bottom:0; background:var(--panel); padding-top:8px; }
</style>
</head>
<body>
<header>
  <b>A-OS</b>
  <span class="stat" id="s-dag">nodes 0</span>
  <span class="stat" id="s-page">pages 0</span>
  <span class="stat" id="s-token">tokens 0</span>
  <span class="stat" id="s-run">running 0</span>
  <span class="stat" id="s-con">连接中…</span>
</header>
<main>
  <section><h3>状态树</h3><div id="dag"></div></section>
  <section><h3>终端</h3><div id="log"></div>
    <div class="bar">
      <form id="f"><input id="cmd" placeholder="输入指令，回车下发（中断当前任务）">
      <button type="button" id="kill">中断</button></form>
    </div>
  </section>
  <section><h3>页表（上下文）</h3><div id="pages"></div></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let ws, logs = [];

function connect() {
  const base = location.pathname.replace(/\/$/, '');
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + base + '/ws');
  ws.onopen = () => $('s-con').textContent = '已连接';
  ws.onclose = () => { $('s-con').textContent = '断开，重连中…'; setTimeout(connect, 1500); };
  ws.onmessage = (e) => render(JSON.parse(e.data));
}

function render(s) {
  $('s-dag').textContent = 'nodes ' + s.dag.length;
  $('s-page').textContent = 'pages ' + s.pages.length;
  $('s-token').textContent = 'tokens ' + s.tokens;
  $('s-run').textContent = 'running ' + s.running;

  $('dag').innerHTML = s.dag.map(n =>
    `<div class="node ${n.status} ${n.kind === 'doc' ? 'doc' : ''}">
       #${n.id} [${n.kind}] ${esc(n.text)}</div>`).join('');

  $('pages').innerHTML = s.pages.map(p =>
    `<div class="page"><b>#${p.id}</b> ${esc(p.preview)}
      ${p.source ? `<span class="tag file">${esc(p.source)}</span>` : ''}
      ${p.stale ? '<span class="tag stale">stale</span>' : ''}
      ${p.pinned ? '<span class="tag pinned">pinned</span>' : ''}
     </div>`).join('');

  const box = $('log');
  box.innerHTML = s.log.map(l => `<div class="${l.cls}">${esc(l.text)}</div>`).join('');
  box.scrollTop = box.scrollHeight;
}

function esc(t) { return String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

$('f').addEventListener('submit', (e) => {
  e.preventDefault();
  const text = $('cmd').value.trim();
  if (!text || !ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ cmd: 'inject', text }));
  $('cmd').value = '';
});

$('kill').onclick = () => ws && ws.readyState === 1 && ws.send(JSON.stringify({ cmd: 'kill' }));

connect();
</script>
</body>
</html>
